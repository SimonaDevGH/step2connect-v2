AWSTemplateFormatVersion: '2010-09-09'
Description: Read/write section visibility configuration for the CMS backend
Parameters:
  BackendIamUserName:
    Type: String
    Default: step2connect-cms-backend
  ContentBucketName:
    Type: String
Resources:
  SectionsConfigPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: step2connect-sections-config
      Users:
        - !Ref BackendIamUserName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${ContentBucketName}/config/sections.json
